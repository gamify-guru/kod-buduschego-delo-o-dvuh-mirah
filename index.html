<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Код будущего — Дело о двух мирах</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #082f2b; color: white; }
    .loader { text-align: center; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Загрузка урока «Код будущего — Дело о двух мирах»...</p>
  </div>
  <script>
    const chunks = ['chunk_aa','chunk_ab','chunk_ac','chunk_ad','chunk_ae','chunk_af','chunk_ag','chunk_ah'];
    async function loadLesson() {
      try {
        let html = '';
        for (const chunk of chunks) {
          const response = await fetch(chunk);
          if (!response.ok) throw new Error('Failed to load ' + chunk);
          html += await response.text();
        }
        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        document.body.innerHTML = '<div style="text-align:center;padding:40px"><h2>Ошибка загрузки</h2><p>' + e.message + '</p><p>Попробуйте обновить страницу.</p></div>';
      }
    }
    loadLesson();
  </script>
</body>
</html>
